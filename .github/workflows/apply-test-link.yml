name: Apply saved CBT test link

on:
  push:
    branches:
      - main
      - feature/test-link
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch saved-test link support
        shell: python
        run: |
          from pathlib import Path

          vm = Path('app/src/main/java/com/example/ui/viewmodel/JeeViewModel.kt')
          s = vm.read_text()
          marker = '    fun resetConversionState() {'
          if 'fun importSavedTestLink(' not in s:
              method = r'''    /** Imports a previously generated CBT snapshot. No PDF extraction or Gemini call is performed. */
              fun importSavedTestLink(input: String) {
                  val rawInput = input.trim()
                  conversionJob?.cancel()
                  conversionTickerJob?.cancel()
                  conversionJob = viewModelScope.launch(Dispatchers.IO) {
                      _conversionState.value = ConversionUiState(
                          isProcessing = true,
                          currentStep = ProcessingStep.BUILDING_CBT,
                          progressPercent = 10,
                          progressMessage = "Loading saved CBT test..."
                      )
                      try {
                          val payload = if (rawInput.startsWith("karam://test/")) {
                              val token = rawInput.substringAfter("karam://test/").substringBefore('?').trim()
                              require(token.isNotBlank()) { "Invalid KARAM test link." }
                              com.example.data.model.TestLinkPayload.decode(token)
                          } else {
                              require(rawInput.startsWith("https://") || rawInput.startsWith("http://")) {
                                  "Paste a KARAM test link or an accessible HTTPS test JSON link."
                              }
                              val connection = (java.net.URL(rawInput).openConnection() as java.net.HttpURLConnection).apply {
                                  requestMethod = "GET"
                                  connectTimeout = 15000
                                  readTimeout = 30000
                                  instanceFollowRedirects = true
                                  setRequestProperty("User-Agent", "KARAM-2027/1.0")
                              }
                              connection.connect()
                              val code = connection.responseCode
                              require(code in 200..299) { "Test link returned HTTP $code." }
                              val body = connection.inputStream.bufferedReader().use { it.readText() }
                              connection.disconnect()
                              val root = org.json.JSONObject(body)
                              val questions = root.optJSONArray("questions")?.toString() ?: "[]"
                              val answers = root.optJSONArray("answerKey")?.toString() ?: "[]"
                              com.example.data.model.TestLinkPayload(
                                  testId = root.getString("testId"),
                                  title = root.optString("title", "Shared JEE CBT"),
                                  durationMinutes = root.optInt("durationMinutes", 180),
                                  questionsJson = questions,
                                  answerKeyJson = answers
                              )
                          }

                          val questions = repository.parseQuestions(payload.questionsJson)
                          require(questions.isNotEmpty()) { "The saved test contains no questions." }

                          val existing = repository.getTestById(payload.testId)
                          if (existing == null) {
                              val phy = questions.count { it.subject == Subject.PHYSICS }
                              val che = questions.count { it.subject == Subject.CHEMISTRY }
                              val mat = questions.count { it.subject == Subject.MATHEMATICS }
                              val test = JeeTestEntity(
                                  testId = payload.testId,
                                  title = payload.title,
                                  sourcePdfName = "Saved CBT Link",
                                  totalQuestions = questions.size,
                                  durationMinutes = payload.durationMinutes,
                                  createdAt = System.currentTimeMillis(),
                                  questionsJson = repository.convertersFromQuestions(questions),
                                  isSample = false,
                                  physicsQuestionsCount = phy,
                                  chemistryQuestionsCount = che,
                                  mathsQuestionsCount = mat,
                                  tags = "Saved CBT Link"
                              )
                              repository.insertTest(test, questions)
                          }

                          _conversionState.value = ConversionUiState(
                              isProcessing = false,
                              currentStep = ProcessingStep.COMPLETE,
                              progressPercent = 100,
                              progressMessage = "Saved CBT loaded successfully.",
                              extractedQuestionsCount = questions.size,
                              validatedCount = questions.size,
                              newlyCreatedTestId = payload.testId,
                              extractedQuestions = questions,
                              isSlowOrStalled = false
                          )
                      } catch (e: Exception) {
                          _conversionState.value = ConversionUiState(
                              isProcessing = false,
                              errorMessage = "Test link import failed: ${e.localizedMessage ?: "invalid saved CBT link"}"
                          )
                      }
                  }
              }

'''
              s = s.replace(marker, method + marker, 1)
              vm.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android:scheme="karam"' not in m:
              needle = '''            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>'''
              replacement = needle + '''\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="karam" android:host="test" />\n            </intent-filter>'''
              m = m.replace(needle, replacement, 1)
              manifest.write_text(m)

          activity = Path('app/src/main/java/com/example/MainActivity.kt')
          a = activity.read_text()
          if 'handleSavedTestLink(intent)' not in a:
              a = a.replace('        enableEdgeToEdge()\n', '        enableEdgeToEdge()\n        handleSavedTestLink(intent)\n', 1)
              anchor = '\n}\n\n@Composable\nfun JeeMainApp'
              handler = '''\n    override fun onNewIntent(intent: android.content.Intent) {\n        super.onNewIntent(intent)\n        setIntent(intent)\n        handleSavedTestLink(intent)\n    }\n\n    private fun handleSavedTestLink(intent: android.content.Intent?) {\n        val uri = intent?.data ?: return\n        if (uri.scheme == "karam" && uri.host == "test") {\n            viewModel.importSavedTestLink(uri.toString())\n        }\n    }\n'''
              a = a.replace(anchor, handler + anchor, 1)
              activity.write_text(a)

          codec = Path('app/src/main/java/com/example/data/model/TestLinkCodec.kt')
          c = codec.read_text()
          c = c.replace('private const val PREFIX = "https://karam-2027.test/t/"', 'private const val PREFIX = "karam://test/"')
          c = c.replace('if (uri.scheme != "https" || uri.host != "karam-2027.test")', 'if (uri.scheme != "karam" || uri.host != "test")')
          codec.write_text(c)

          ui = Path('app/src/main/java/com/example/ui/components/LinkToCbtSection.kt')
          u = ui.read_text()
          u = u.replace('var pdfUrl by remember { mutableStateOf("") }', 'var testLink by remember { mutableStateOf("") }')
          u = u.replace('"Paste the direct PDF link. The existing Gemini extraction, test saving, analysis and history stay unchanged."', '"Paste a saved KARAM test link. It opens the already-generated CBT without PDF extraction or another Gemini call."')
          u = u.replace('value = pdfUrl,', 'value = testLink,')
          u = u.replace('onValueChange = { pdfUrl = it },', 'onValueChange = { testLink = it },')
          u = u.replace('label = { Text("Paste PDF Link") },', 'label = { Text("Paste KARAM Test Link") },')
          u = u.replace('placeholder = { Text("https://.../paper.pdf") },', 'placeholder = { Text("karam://test/... or HTTPS test JSON link") },')
          u = u.replace('if (pdfUrl.isNotBlank())', 'if (testLink.isNotBlank())')
          u = u.replace('onClick = { pdfUrl = "" }', 'onClick = { testLink = "" }')
          old = '''                viewModel.convertPdfFromUrl(\n                    testTitle = testTitle.ifBlank { "Linked JEE Paper" },\n                    pdfUrl = pdfUrl.trim(),\n                    answerKeyUri = null,\n                    fallbackAnswerText = "",\n                    durationMinutes = duration.toIntOrNull()?.coerceIn(1, 600) ?: 180\n                )'''
          u = u.replace(old, '                viewModel.importSavedTestLink(testLink.trim())')
          u = u.replace('enabled = pdfUrl.trim().startsWith("http://") || pdfUrl.trim().startsWith("https://"),', 'enabled = testLink.trim().startsWith("karam://test/") || testLink.trim().startsWith("http://") || testLink.trim().startsWith("https://"),')
          u = u.replace('conversionState.progressMessage.ifBlank { "Downloading and analysing PDF..." }', 'conversionState.progressMessage.ifBlank { "Loading saved CBT snapshot..." }')
          ui.write_text(u)

          doc = Path('TEST_LINK_FORMAT.md')
          doc.write_text('''# KARAM Saved Test Link\n\nA KARAM test link is an immutable snapshot of one generated CBT. Opening it imports the saved questions into the existing Test Library and launches the same NTA-style CBT flow. No PDF extraction and no Gemini call happen when an existing test link is opened.\n\nFormat: `karam://test/<encoded-payload>`\n\nFor large tests, the payload can also be hosted as a JSON file and pasted as an HTTPS test JSON link.\n''')

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/viewmodel/JeeViewModel.kt app/src/main/AndroidManifest.xml app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/data/model/TestLinkCodec.kt app/src/main/java/com/example/ui/components/LinkToCbtSection.kt TEST_LINK_FORMAT.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat: apply saved CBT test link"
          git push
