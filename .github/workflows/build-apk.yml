name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version $JAVA_MAJOR is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore created and verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO="${{ github.repository }}"
          REPO_NAME="${RAW_REPO##*/}"
          CLEAN_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          RELEASE_ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"

          TEMP_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TEMP_DIR"
          ASSET_PATH="$TEMP_DIR/$RELEASE_ASSET_NAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset $ASSET_PATH is empty or missing."
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH ($RELEASE_ASSET_NAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is invalid or missing."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ## 🚀 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          ### Build Details
          - **GitHub Actions Run Number:** ${{ github.run_number }}
          - **GitHub Actions Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** `${{ github.sha }}`
          - **Source Branch:** `${{ github.ref_name }}`

          ### Important Notice
          - ⚠️ **Testing Only:** This APK is intended for testing and verification.
          - ⚠️ **Not for Production:** This is not a Play Store production release.
          - 🔑 **Debug Signature:** This APK is signed only with a temporary debug keystore.

          ### Download
          Download the APK directly from the **Assets** section below.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          SERVER_URL="${{ github.server_url }}"
          REPO="${{ github.repository }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "============================================================"
            echo " GitHub Release Created Successfully!"
            echo "============================================================"
            gh release view "$RELEASE_TAG"
            RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            {
              echo "## 📱 Debug APK Release Published"
              echo ""
              echo "The debug APK has been successfully built and published to GitHub Releases."
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "### 📥 How to Download"
              echo "1. Visit the [GitHub Release Page]($RELEASE_URL)."
              echo "2. Under the **Assets** section, click on \`$ASSET_NAME\` to download and install on your phone."
              echo ""
              echo "*(Note: The standard Actions artifact \`app-debug-apk\` is also preserved and available under the Actions run artifacts.)*"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "============================================================"
            echo " Warning: GitHub Release Publishing Failed"
            echo "============================================================"
            echo "::warning::Release creation failed, but the debug APK was built successfully."
            echo "The debug APK is available as a GitHub Actions artifact named 'app-debug-apk'."

            {
              echo "## ⚠️ Debug APK Built (Artifact Available)"
              echo ""
              echo "- **APK Build Status:** ✅ Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (Available for download from this run's Artifacts section)"
              echo "- **Release Publishing:** ⚠️ Release creation encountered an error or lacked permissions."
              echo ""
              echo "You can still download the built APK directly from the **Artifacts** section at the top/bottom of this GitHub Actions summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
