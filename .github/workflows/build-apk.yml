name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - feature/test-link
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then exit 1; fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then exit 1; fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK verified: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

      - name: Generate and validate QPT-02 KARAM test link
        run: |
          gradle :app:testDebugUnitTest --tests com.example.Qpt2TestLinkTest --stacktrace --no-daemon
          test -s /tmp/qpt2-test-link.txt
          cp /tmp/qpt2-test-link.txt ./qpt2-test-link.txt
          echo "QPT-02 test link generated and validated."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload QPT-02 test link artifact
        uses: actions/upload-artifact@v4
        with:
          name: qpt2-test-link-${{ github.run_number }}
          path: qpt2-test-link.txt
          if-no-files-found: error
