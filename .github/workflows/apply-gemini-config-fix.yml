name: Apply Gemini config fix

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace invalid Gemini config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/ai/GeminiJeeExtractor.kt")
          s = p.read_text()
          old = '''                val genConfig = JSONObject().apply {
                                                            put("maxOutputTokens", 8192)
                    val responseFormat = JSONObject().apply {
                        put("text", JSONObject().apply {
                            put("mimeType", "application/json")
                        })
                    }
                    put("responseFormat", responseFormat)
                }
'''
          new = '''                val genConfig = JSONObject().apply {
                    put("maxOutputTokens", 8192)
                    put("responseMimeType", "application/json")
                }
'''
          if old not in s:
              raise SystemExit("Target Gemini generationConfig block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ai/GeminiJeeExtractor.kt
          git commit -m "Fix Gemini JSON response generation config"
          git push
